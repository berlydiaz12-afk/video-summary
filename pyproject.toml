[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "preproc-video"
version = "0.1.0"
description = "Resumen y preprocesamiento de video para Video Swin Transformer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "torch>=2.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]

[project.scripts]
preproc = "preproc.cli:main"

[tool.setuptools.packages.find]
include = ["preproc*"]
